<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="100%" height="100%">
  <defs>
    <!-- Arrowhead marker definition -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333" />
    </marker>
    
    <!-- Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.1" />
    </filter>
  </defs>

  <style>
    .bg { fill: #f8fafc; }
    .cloud-bg { fill: #ffffff; stroke: #475569; stroke-width: 3; stroke-dasharray: none; }
    .box { fill: #f1f5f9; stroke: #334155; stroke-width: 2; rx: 8; ry: 8; }
    .dest-box { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2.5; rx: 8; ry: 8; }
    .text-title { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 600; font-size: 16px; fill: #1e293b; text-anchor: middle; }
    .dest-text { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 600; font-size: 18px; fill: #0369a1; text-anchor: middle; }
    .arrow-line { stroke: #333333; stroke-width: 3; fill: none; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Outer Cloud/Group Container -->
  <g filter="url(#shadow)">
    <path class="cloud-bg" d="
      M 150 150 
      C 120 100, 220 50, 320 70 
      C 400 40, 550 50, 620 90 
      C 720 110, 750 220, 730 320 
      C 770 420, 720 550, 650 580 
      C 550 620, 380 610, 280 580 
      C 150 600, 80 500, 100 380 
      C 70 280, 100 180, 150 150 Z" />
  </g>

  <!-- Source Location A -->
  <g filter="url(#shadow)">
    <rect x="180" y="130" width="180" height="100" class="box" />
    <text x="270" y="185" class="text-title">Source Location A</text>
  </g>

  <!-- Source Location B -->
  <g filter="url(#shadow)">
    <rect x="450" y="130" width="180" height="100" class="box" />
    <text x="540" y="185" class="text-title">Source Location B</text>
  </g>

  <!-- Source Location C -->
  <g filter="url(#shadow)">
    <rect x="180" y="380" width="180" height="100" class="box" />
    <text x="270" y="435" class="text-title">Source Location C</text>
  </g>

  <!-- Source Location D -->
  <g filter="url(#shadow)">
    <rect x="450" y="380" width="180" height="100" class="box" />
    <text x="540" y="435" class="text-title">Source Location D</text>
  </g>

  <!-- Downward Arrow -->
  <path d="M 410 600 L 410 690" class="arrow-line" marker-end="url(#arrow)" />

  <!-- Destination Box: Process to store into PostgreSQL -->
  <g filter="url(#shadow)">
    <rect x="230" y="700" width="360" height="100" class="dest-box" />
    <text x="410" y="745" class="dest-text">Process to</text>
    <text x="410" y="770" class="dest-text">store into PostgreSQL</text>
  </g>
</svg>