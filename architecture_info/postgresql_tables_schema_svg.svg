<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <defs>
    <!-- Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <style>
    .bg { fill: #f8fafc; }
    
    /* Table Container Styling */
    .table-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 10; ry: 10; }
    .header-sources { fill: #2563eb; }
    .header-records { fill: #0d9488; }
    
    /* Typography */
    .table-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #ffffff; }
    .col-header { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
    .col-name { font-family: 'Consolas', 'Courier New', monospace; font-size: 15px; font-weight: 600; fill: #1e293b; }
    .col-pk { fill: #d97706; font-size: 11px; font-weight: 700; font-family: 'Segoe UI', sans-serif; }
    .col-fk { fill: #2563eb; font-size: 11px; font-weight: 700; font-family: 'Segoe UI', sans-serif; }
    
    /* Divider lines */
    .row-divider { stroke: #f1f5f9; stroke-width: 1.5; }
    .header-divider { stroke: #e2e8f0; stroke-width: 2; }
    
    /* Relationship Line */
    .rel-line { stroke: #2563eb; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- TABLE 1: sources -->
  <g transform="translate(60, 80)" filter="url(#shadow)">
    <rect width="340" height="260" class="table-box" />
    
    <!-- Table Header -->
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 330 0 A 10 10 0 0 1 340 10 L 340 45 L 0 45 Z" class="header-sources" />
    <text x="20" y="28" class="table-title">table sources</text>
    
    <!-- Rows -->
    <!-- Column Headers -->
    <text x="20" y="70" class="col-header">Column Name</text>
    <line x1="0" y1="82" x2="340" y2="82" class="header-divider" />
    
    <!-- Row 1: source_id -->
    <text x="20" y="115" class="col-name">source_id</text>
    <text x="280" y="115" class="col-pk">PK</text>
    <line x1="20" y1="135" x2="320" y2="135" class="row-divider" />
    
    <!-- Row 2: state -->
    <text x="20" y="168" class="col-name">state</text>
    <line x1="20" y1="188" x2="320" y2="188" class="row-divider" />
    
    <!-- Row 3: last_timestamp -->
    <text x="20" y="221" class="col-name">last_timestamp</text>
  </g>

  <!-- TABLE 2: records -->
  <g transform="translate(480, 80)" filter="url(#shadow)">
    <rect width="360" height="360" class="table-box" />
    
    <!-- Table Header -->
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 350 0 A 10 10 0 0 1 360 10 L 360 45 L 0 45 Z" class="header-records" />
    <text x="20" y="28" class="table-title">table records</text>
    
    <!-- Rows -->
    <!-- Column Headers -->
    <text x="20" y="70" class="col-header">Column Name</text>
    <line x1="0" y1="82" x2="360" y2="82" class="header-divider" />
    
    <!-- Row 1: record_id -->
    <text x="20" y="115" class="col-name">record_id</text>
    <text x="300" y="115" class="col-pk">PK</text>
    <line x1="20" y1="135" x2="340" y2="135" class="row-divider" />
    
    <!-- Row 2: text_vector -->
    <text x="20" y="168" class="col-name">text_vector</text>
    <line x1="20" y1="188" x2="340" y2="188" class="row-divider" />
    
    <!-- Row 3: visual_vector -->
    <text x="20" y="221" class="col-name">visual_vector</text>
    <line x1="20" y1="241" x2="340" y2="241" class="row-divider" />

    <!-- Row 4: state -->
    <text x="20" y="274" class="col-name">state</text>
    <line x1="20" y1="294" x2="340" y2="294" class="row-divider" />

    <!-- Row 5: source_id -->
    <text x="20" y="327" class="col-name">source_id</text>
    <text x="300" y="327" class="col-fk">FK</text>
  </g>

  <!-- Relationship Connector (source_id to source_id) -->
  <path d="M 400 195 L 440 195 L 440 407 L 480 407" class="rel-line" />
  <circle cx="400" cy="195" r="4" fill="#2563eb" />
  <circle cx="480" cy="407" r="4" fill="#2563eb" />
</svg>