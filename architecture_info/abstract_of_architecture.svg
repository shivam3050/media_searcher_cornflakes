<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.07" />
    </filter>
  </defs>

  <style>
    .bg { fill: #f8fafc; }

    .oval-node { fill: #ffffff; stroke: #475569; stroke-width: 2; }
    .admin-node { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .public-node { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
    .process-node { fill: #fef3c7; stroke: #d97706; stroke-width: 2.5; }
    .db-node { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2.5; }

    .text-main { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 16px; fill: #1e293b; text-anchor: middle; }
    .text-blue { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 16px; fill: #1d4ed8; text-anchor: middle; }
    .text-purple { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 16px; fill: #6d28d9; text-anchor: middle; }
    .text-amber { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 16px; fill: #92400e; text-anchor: middle; }
    .text-db { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 17px; fill: #0369a1; text-anchor: middle; }

    .label-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 14px; fill: #64748b; text-anchor: middle; }
    .label-purple { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 14px; fill: #6d28d9; text-anchor: middle; }
    .label-blue { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 14px; fill: #1d4ed8; text-anchor: middle; }

    .flow-line { stroke: #475569; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #2563eb; stroke-width: 2; fill: none; stroke-dasharray: 4 4; stroke-linecap: round; }
    .purple-line { stroke: #7c3aed; stroke-width: 2; fill: none; stroke-dasharray: 4 4; stroke-linecap: round; }
  </style>

  <rect width="100%" height="100%" class="bg" />

  <!-- LEFT COLUMN: Public request flow -->
  <g filter="url(#shadow)">
    <rect x="80" y="60" width="220" height="60" rx="30" ry="30" class="public-node" />
    <text x="190" y="96" class="text-purple">Public request</text>
  </g>

  <path d="M 190 120 C 130 160, 130 220, 190 260" class="purple-line" marker-end="url(#arrow-purple)" />
  <rect x="80" y="175" width="110" height="26" rx="4" ry="4" fill="#f8fafc" />
  <text x="135" y="193" class="label-purple">on public worker</text>

  <g filter="url(#shadow)">
    <rect x="80" y="260" width="220" height="60" rx="30" ry="30" class="public-node" />
    <text x="190" y="296" class="text-purple">request process</text>
  </g>

  <!-- RIGHT COLUMN: Admin and main pipeline flow -->
  <g filter="url(#shadow)">
    <rect x="650" y="60" width="220" height="60" rx="30" ry="30" class="admin-node" />
    <text x="760" y="96" class="text-blue">admin command</text>
  </g>

  <path d="M 760 120 C 700 160, 700 220, 760 260" class="blue-line" marker-end="url(#arrow-blue)" />
  <rect x="645" y="175" width="120" height="26" rx="4" ry="4" fill="#f8fafc" />
  <text x="705" y="193" class="label-blue">on private worker</text>

  <g filter="url(#shadow)">
    <rect x="690" y="260" width="140" height="60" rx="30" ry="30" class="oval-node" />
    <text x="760" y="296" class="text-main">run</text>
  </g>

  <!-- run to process: async / await -->
  <path d="M 760 320 L 760 460" class="flow-line" marker-end="url(#arrow)" />
  <rect x="705" y="375" width="110" height="26" rx="4" ry="4" fill="#f8fafc" />
  <text x="760" y="393" class="label-text">async / await</text>

  <g filter="url(#shadow)">
    <rect x="610" y="460" width="300" height="70" rx="35" ry="35" class="process-node" />
    <text x="760" y="502" class="text-amber">process to PostgreSQL</text>
  </g>

  <!-- BOTTOM BRANCHES -->
  <g filter="url(#shadow)">
    <rect x="420" y="660" width="220" height="65" rx="30" ry="30" class="oval-node" />
    <text x="530" y="700" class="text-main">media Locations</text>
  </g>

  <!-- media Locations to process -->
  <path d="M 530 660 L 710 530" class="flow-line" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="670" y="660" width="220" height="65" rx="30" ry="30" class="db-node" />
    <text x="780" y="700" class="text-db">PostgreSQL</text>
  </g>

  <!-- process to PostgreSQL -->
  <path d="M 760 530 L 780 660" class="flow-line" marker-end="url(#arrow)" />

</svg>
