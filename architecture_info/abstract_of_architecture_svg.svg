<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 1200" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.07" />
    </filter>
  </defs>

  <style>
    .bg { fill: #f8fafc; }

    .input-node { fill: #ffffff; stroke: #475569; stroke-width: 2; }
    .server-node { fill: #f1f5f9; stroke: #334155; stroke-width: 2.5; }
    .verify-node { fill: #fef2f2; stroke: #ef4444; stroke-width: 2.5; }
    .admin-node { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .public-node { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
    .process-node { fill: #fef3c7; stroke: #d97706; stroke-width: 2.5; }
    .db-node { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2.5; }
    .oval-node { fill: #ffffff; stroke: #475569; stroke-width: 2; }

    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-anchor: middle; }
    .text-title { font-weight: 600; font-size: 16px; fill: #1e293b; }
    .text-server { font-weight: 600; font-size: 18px; fill: #1e293b; }
    .text-verify { font-weight: 700; font-size: 16px; fill: #dc2626; }
    .text-blue { font-weight: 600; font-size: 16px; fill: #1d4ed8; }
    .text-purple { font-weight: 600; font-size: 16px; fill: #6d28d9; }
    .text-amber { font-weight: 700; font-size: 16px; fill: #92400e; }
    .text-db { font-weight: 700; font-size: 17px; fill: #0369a1; }
    .label-text { font-weight: 500; font-size: 13px; fill: #64748b; }
    .label-purple { font-weight: 500; font-size: 13px; fill: #6d28d9; }
    .label-blue { font-weight: 500; font-size: 13px; fill: #1d4ed8; }

    .flow-line { stroke: #475569; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { stroke: #2563eb; stroke-width: 2; fill: none; stroke-dasharray: 4 4; stroke-linecap: round; }
    .purple-line { stroke: #7c3aed; stroke-width: 2; fill: none; stroke-dasharray: 4 4; stroke-linecap: round; }
  </style>

  <rect width="100%" height="100%" class="bg" />

  <!-- TOP SECTION: entry and verification -->
  <g filter="url(#shadow)">
    <rect x="450" y="40" width="250" height="60" rx="8" ry="8" class="input-node" />
    <text x="575" y="76" class="text-title">request / command</text>
  </g>

  <path d="M 575 100 L 575 150" class="flow-line" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="465" y="150" width="220" height="70" rx="12" ry="12" class="server-node" />
    <text x="575" y="192" class="text-server">Server</text>
  </g>

  <path d="M 575 220 L 575 260" class="flow-line" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <ellipse cx="575" cy="300" rx="75" ry="40" class="verify-node" />
    <text x="575" y="306" class="text-verify">verify it</text>
  </g>

  <!-- branch left: public request -->
  <path d="M 520 328 L 210 410" class="flow-line" marker-end="url(#arrow)" />

  <!-- branch right: admin command -->
  <path d="M 630 328 L 760 410" class="flow-line" marker-end="url(#arrow)" />

  <!-- MIDDLE SECTION: workflows -->

  <!-- left branch: public request -->
  <g filter="url(#shadow)">
    <rect x="100" y="410" width="220" height="60" rx="30" ry="30" class="public-node" />
    <text x="210" y="446" class="text-purple">Public request</text>
  </g>

  <path d="M 210 470 C 150 510, 150 570, 210 610" class="purple-line" marker-end="url(#arrow-purple)" />
  <rect x="95" y="525" width="125" height="26" rx="4" ry="4" fill="#f8fafc" />
  <text x="157" y="543" class="label-purple">on public worker</text>

  <g filter="url(#shadow)">
    <rect x="100" y="610" width="220" height="60" rx="30" ry="30" class="public-node" />
    <text x="210" y="646" class="text-purple">request process</text>
  </g>

  <!-- right branch: admin command -->
  <g filter="url(#shadow)">
    <rect x="650" y="410" width="220" height="60" rx="30" ry="30" class="admin-node" />
    <text x="760" y="446" class="text-blue">admin command</text>
  </g>

  <!-- sub-branch: private heavy worker to run -->
  <path d="M 760 470 C 690 510, 690 570, 760 610" class="blue-line" marker-end="url(#arrow-blue)" />
  <rect x="635" y="525" width="155" height="26" rx="4" ry="4" fill="#f8fafc" />
  <text x="712" y="543" class="label-blue">on private heavy worker</text>

  <g filter="url(#shadow)">
    <rect x="690" y="610" width="140" height="60" rx="30" ry="30" class="oval-node" />
    <text x="760" y="646" class="text-title">run</text>
  </g>

  <!-- sub-branch: private simple worker to command process -->
  <path d="M 870 440 L 980 440 L 980 610" class="blue-line" marker-end="url(#arrow-blue)" />
  <rect x="900" y="510" width="160" height="26" rx="4" ry="4" fill="#f8fafc" />
  <text x="980" y="528" class="label-blue">on private simple worker</text>

  <g filter="url(#shadow)">
    <rect x="880" y="610" width="200" height="60" rx="30" ry="30" class="admin-node" />
    <text x="980" y="646" class="text-blue">command process</text>
  </g>

  <!-- BOTTOM SECTION: pipeline and DB -->
  <path d="M 760 670 L 760 810" class="flow-line" marker-end="url(#arrow)" />
  <rect x="705" y="730" width="110" height="26" rx="4" ry="4" fill="#f8fafc" />
  <text x="760" y="748" class="label-text">async / await</text>

  <g filter="url(#shadow)">
    <rect x="610" y="810" width="300" height="70" rx="35" ry="35" class="process-node" />
    <text x="760" y="852" class="text-amber">process to PostgreSQL</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="420" y="1030" width="220" height="65" rx="30" ry="30" class="oval-node" />
    <text x="530" y="1070" class="text-title">media Locations</text>
  </g>

  <path d="M 530 1030 L 710 880" class="flow-line" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="670" y="1030" width="220" height="65" rx="30" ry="30" class="db-node" />
    <text x="780" y="1070" class="text-db">PostgreSQL</text>
  </g>

  <path d="M 760 880 L 780 1030" class="flow-line" marker-end="url(#arrow)" />

</svg>
